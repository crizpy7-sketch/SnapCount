<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

   CONFIG  (rename brand, set prices, paste your Stripe links here)

const SEASON = "2026";

// In this preview the AI runs through Claude's built-in artifact API.
// For your DEPLOYED app, route this through your own Supabase Edge Function
// proxy (your ANTHROPIC_API_KEY as a secret) so paying users trigger it, not
// the open internet. See the notes I sent with this file. Swap AI_ENDPOINT.
const AI_ENDPOINT = "https://api.anthropic.com/v1/messages";
const MODEL = "claude-sonnet-4-6";

const PRICING = {
  monthly: { key: "monthly", label: "Pro Monthly", price: "$8.99", per: "/mo", note: "", link: "" },  // <- paste Stripe subscription link
  annual:  { key: "annual",  label: "Pro Annual",  price: "$59.99", per: "/yr", note: "Save 44%", link: "" }, // <- paste Stripe subscription link
};

const PRO_KEY = "snapcount_pro_v1";
const ROSTER_KEY = "snapcount_roster_v1";
const POSITIONS = ["QB", "RB", "WR", "TE", "K", "DEF"];

/* =========================================================================
   HELPERS
   ========================================================================= */
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms)),
  ]);
}

async function askAI(system, user) {
  // Combine into a single user turn for max compatibility with the proxy.
  const res = await fetch(AI_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 1000,
      messages: [{ role: "user", content: system + "\n\n" + user }],
    }),
  });
  if (!res.ok) throw new Error("AI request failed (" + res.status + ")");
  const data = await res.json();
  return (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n")
    .trim();
}

function extractJSON(text) {
  let t = String(text).replace(/```json/gi, "").replace(/```/g, "").trim();
  const s = t.indexOf("{");
  const e = t.lastIndexOf("}");
  if (s >= 0 && e > s) t = t.slice(s, e + 1);
  return JSON.parse(t);
}

let PLAYERS_CACHE = null;
async function loadPlayersMap() {
  if (PLAYERS_CACHE) return PLAYERS_CACHE;
  const res = await withTimeout(fetch("https://api.sleeper.app/v1/players/nfl"), 12000);
  const map = await res.json();
  PLAYERS_CACHE = map;
  return map;
}

const SAMPLE_TRENDING = [
  { id: null, name: "Jaylen Wright", pos: "RB", team: "MIA", count: 42180 },
  { id: null, name: "Ja'Lynn Polk", pos: "WR", team: "NE", count: 31240 },
  { id: null, name: "Ben Sinnott", pos: "TE", team: "WAS", count: 24990 },
  { id: null, name: "Tyjae Spears", pos: "RB", team: "TEN", count: 22110 },
  { id: null, name: "Jalen McMillan", pos: "WR", team: "TB", count: 18760 },
  { id: null, name: "Michael Penix Jr.", pos: "QB", team: "ATL", count: 16540 },
  { id: null, name: "Roschon Johnson", pos: "RB", team: "CHI", count: 14320 },
  { id: null, name: "Cade Otton", pos: "TE", team: "TB", count: 12080 },
];

async function fetchTrending() {
  // Try live Sleeper adds, resolve names via the player map. Fall back to sample.
  const addsRes = await withTimeout(
    fetch("https://api.sleeper.app/v1/players/nfl/trending/add?lookback_hours=72&limit=15"),
    9000
  );
  const adds = await addsRes.json(); // [{player_id, count}]
  if (!Array.isArray(adds) || adds.length === 0) throw new Error("no adds");
  const map = await loadPlayersMap();
  const rows = adds
    .map((a) => {
      const p = map[a.player_id];
      if (!p) return null;
      const name = p.full_name || ((p.first_name || "") + " " + (p.last_name || "")).trim() || p.player_id;
      return { id: a.player_id, name, pos: p.position || "?", team: p.team || "FA", count: a.count || 0 };
    })
    .filter(Boolean);
  if (rows.length === 0) throw new Error("no resolved");
  return rows;
}

function headshot(id) {
  return id ? "https://sleepercdn.com/content/nfl/players/" + id + ".jpg" : null;
}

  x: (p) => (<svg viewBox="0 0 24 24" fill="none" {...p}><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>),

};

/* =========================================================================
   SMALL UI PIECES
   ========================================================================= */
function PosChip({ pos }) {

    <span className="font-display text-[10px] font-800 tracking-wide px-1.5 py-0.5 rounded bg-ink border border-line text-mut">
      {pos}

function Spinner({ className = "w-5 h-5" }) {

function ConfBar({ value }) {
  const v = Math.max(0, Math.min(100, Number(value) || 0));
  return (
    <div className="flex items-center gap-2">

      <span className="tnum text-[11px] text-mut font-semibold w-8 text-right">{v}%</span>

}

function VerdictPill({ v }) {
  const s = String(v || "").toUpperCase();
  const map = {
    START: "bg-good/15 text-good border-good/30",
    SIT: "bg-bad/12 text-bad border-bad/30",
    FLEX: "bg-edge/12 text-edge border-edge/30",
    ACCEPT: "bg-good/15 text-good border-good/30",
    DECLINE: "bg-bad/12 text-bad border-bad/30",
    COUNTER: "bg-edge/12 text-edge border-edge/30",
  };
  return (
    <span className={"font-display text-[11px] font-800 tracking-wide px-2 py-0.5 rounded-full border " + (map[s] || "bg-panel2 text-mut border-line")}>
      {s}
    </span>
  );
}

function GradeBadge({ grade }) {
  const g = String(grade || "").charAt(0).toUpperCase();
  const color =
    g === "A" ? "text-good border-good/40" :
    g === "B" ? "text-good border-good/30" :
    g === "C" ? "text-edge border-edge/40" :
    g === "D" ? "text-[#f0883e] border-[#f0883e]/40" :
    "text-bad border-bad/40";
  return (
    <div className={"font-display font-900 text-3xl leading-none w-16 h-16 rounded-xl border-2 grid place-items-center bg-ink " + color}>
      {grade || "?"}
    </div>
  );
}

function Toast({ msg, onDone }) {
  useEffect(() => {
    const t = setTimeout(onDone, 3200);
    return () => clearTimeout(t);
  }, []);
  return (
    <div className="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 max-w-[92%] fadeup">
      <div className="bg-panel2 border border-line text-fg text-sm rounded-xl px-4 py-3 shadow-2xl">{msg}</div>
    </div>
  );
}

/* Reusable roster / player list editor */
function PlayerListEditor({ players, setPlayers, showOpp = false, namePlaceholder = "Player name", accent = "edge" }) {
  const [name, setName] = useState("");
  const [pos, setPos] = useState("RB");
  const [opp, setOpp] = useState("");

  function add() {
    const n = name.trim();
    if (!n) return;
    setPlayers([...players, { name: n, pos, opp: opp.trim() }]);
    setName(""); setOpp("");
  }
  function remove(i) {
    setPlayers(players.filter((_, idx) => idx !== i));
  }

  return (
    <div>
      <div className="flex gap-2">
        <input
          value={name}
          onChange={(e) => setName(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") add(); }}
          placeholder={namePlaceholder}
          className="flex-1 min-w-0 bg-ink border border-line rounded-lg px-3 py-2.5 text-sm placeholder-mut/70"
        />
        <select value={pos} onChange={(e) => setPos(e.target.value)} className="bg-ink border border-line rounded-lg px-2 py-2.5 text-sm font-semibold">
          {POSITIONS.map((p) => <option key={p} value={p}>{p}</option>)}
        </select>
      </div>
      {showOpp && (
        <input
          value={opp}
          onChange={(e) => setOpp(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") add(); }}
          placeholder="Opponent (optional), e.g. at DAL"
          className="mt-2 w-full bg-ink border border-line rounded-lg px-3 py-2.5 text-sm placeholder-mut/70"
        />
      )}
      <button onClick={add} className={"mt-2 w-full flex items-center justify-center gap-1.5 rounded-lg py-2.5 text-sm font-semibold border border-" + accent + "/40 text-" + accent + " bg-" + accent + "/10 active:scale-[.99] transition"}>
        <I.plus className="w-4 h-4" /> Add player
      </button>

      {players.length > 0 && (
        <div className="mt-3 space-y-1.5">
          {players.map((p, i) => (
            <div key={i} className="flex items-center gap-2.5 bg-ink border border-line rounded-lg px-3 py-2">
              <PosChip pos={p.pos} />
              <span className="text-sm font-medium flex-1 truncate">{p.name}</span>
              {p.opp ? <span className="text-[11px] text-mut truncate max-w-[90px]">{p.opp}</span> : null}
              <button onClick={() => remove(i)} aria-label={"Remove " + p.name} className="text-mut hover:text-bad p-1">
                <I.x className="w-4 h-4" />
              </button>
            </div>
          ))}
        </div>
      )}

  );
}

function Card({ children, className = "" }) {

        See plans

  );
}

   ========================================================================= */

              onClick={() => go("upgrade")}

/* ---------------- START / SIT ---------------- */
function StartSit({ isPro, go }) {
  const [players, setPlayers] = useState([]);
  const [format, setFormat] = useState("PPR");
  const [week, setWeek] = useState(DEFAULT_WEEK);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [raw, setRaw] = useState("");
  const [err, setErr] = useState("");

  async function run() {
    setErr(""); setRaw(""); setResult(null); setLoading(true);
    const system = "You are an elite fantasy football analyst who gives fast, decisive start and sit calls. Weigh matchup, target and carry share, recent form, injuries, weather, and the scoring format. Respond with ONLY valid JSON, no markdown and no preamble. Shape: {\"summary\":\"one or two sentence overall read\",\"ranking\":[{\"player\":\"name\",\"pos\":\"RB\",\"verdict\":\"START|SIT|FLEX\",\"confidence\":0-100,\"reason\":\"one sentence\"}]}. Order from most confident start down to sit.";
    const user = "Scoring: " + format + ". Week " + week + ", " + SEASON + " season. Players I am deciding between:\n" +
      players.map((p) => "- " + p.name + " (" + p.pos + ")" + (p.opp ? " " + p.opp : "")).join("\n") +
      "\nGive the ranked start order.";
    try {
      const text = await askAI(system, user);
      try { setResult(extractJSON(text)); } catch (e) { setRaw(text); }
    } catch (e) {
      setErr(e.message);
    } finally {
      setLoading(false);
    }
  }

  if (!isPro) {
    return (
      <LockGate
        title="Start/Sit Optimizer"
        blurb="Stop second-guessing your flex. Get a ranked call in seconds."
        bullets={["Ranked start order with confidence", "Plain-English reason for each call", "PPR, half PPR, and standard scoring"]}
        onSee={() => go("upgrade")}
      />
    );
  }

  return (
    <div className="fadeup">
      <h1 className="font-display font-900 text-2xl">Start/Sit Optimizer</h1>
      <p className="text-sm text-mut mt-1">Add the players you are choosing between.</p>

      <Card className="p-4 mt-4">
        <PlayerListEditor players={players} setPlayers={setPlayers} showOpp />
        <div className="grid grid-cols-2 gap-2 mt-3">
          <div>
            <label className="text-[11px] text-mut font-semibold">Scoring</label>
            <select value={format} onChange={(e) => setFormat(e.target.value)} className="mt-1 w-full bg-ink border border-line rounded-lg px-3 py-2.5 text-sm font-semibold">
              {["PPR", "Half PPR", "Standard"].map((f) => <option key={f}>{f}</option>)}
            </select>
          </div>
          <div>
            <label className="text-[11px] text-mut font-semibold">Week</label>
            <select value={week} onChange={(e) => setWeek(Number(e.target.value))} className="mt-1 w-full bg-ink border border-line rounded-lg px-3 py-2.5 text-sm font-semibold tnum">
              {Array.from({ length: 18 }, (_, i) => i + 1).map((w) => <option key={w} value={w}>Week {w}</option>)}
            </select>
          </div>
        </div>
        <button
          onClick={run}
          disabled={players.length < 2 || loading}
          className="mt-4 w-full bg-edge text-ink font-display font-800 rounded-lg py-3 disabled:opacity-40 flex items-center justify-center gap-2 active:scale-[.99] transition"
        >
          {loading ? <><Spinner className="w-5 h-5" /> Analyzing matchups</> : <>Get the call <I.arrow className="w-4 h-4" /></>}
        </button>
        {players.length < 2 && <p className="text-[11px] text-mut mt-2 text-center">Add at least two players to compare.</p>}
      </Card>

      {err && <div className="mt-4"><AIError msg={err} onRetry={run} /></div>}

      {result && (
        <div className="mt-4 space-y-3 fadeup">
          {result.summary && <Card className="p-4"><p className="text-sm text-fg leading-relaxed">{result.summary}</p></Card>}
          {(result.ranking || []).map((r, i) => (
            <Card key={i} className="p-4">
              <div className="flex items-center gap-3">
                <div className="font-display font-900 text-lg text-mut w-6 tnum">{i + 1}</div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2">
                    <PosChip pos={r.pos} />
                    <span className="font-semibold truncate">{r.player}</span>
                  </div>
                </div>
                <VerdictPill v={r.verdict} />
              </div>
              <div className="mt-3"><ConfBar value={r.confidence} /></div>
              <p className="text-sm text-mut mt-2 leading-relaxed">{r.reason}</p>
            </Card>
          ))}
          <Disclaimer />
        </div>
      )}

      {raw && <Card className="p-4 mt-4"><p className="text-sm text-fg whitespace-pre-wrap leading-relaxed">{raw}</p><Disclaimer /></Card>}
    </div>
  );
}

function Trades({ isPro, go }) {

  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [raw, setRaw] = useState("");
  const [err, setErr] = useState("");

  async function run() {
    setErr(""); setRaw(""); setResult(null); setLoading(true);
    const system = "You are a sharp fantasy football trade analyst. Grade the trade decisively from the perspective of the manager giving the first list. Weigh rest-of-season value, positional need, scoring format, and player risk. Respond with ONLY valid JSON, no markdown. Shape: {\"grade\":\"A|A-|B+|B|B-|C+|C|C-|D|F\",\"verdict\":\"ACCEPT|DECLINE|COUNTER\",\"winner\":\"you|them|even\",\"summary\":\"two or three sentence explanation\",\"keys\":[\"short point\",\"short point\"]}.";
    const user = "Scoring: " + format + ", " + SEASON + " season.\nYou GIVE: " +
      give.map((p) => p.name + " (" + p.pos + ")").join(", ") + "\nYou GET: " +
      get.map((p) => p.name + " (" + p.pos + ")").join(", ") + "\nGrade this trade for me.";
    try {
      const text = await askAI(system, user);
      try { setResult(extractJSON(text)); } catch (e) { setRaw(text); }
    } catch (e) { setErr(e.message); } finally { setLoading(false); }
  }

  if (!isPro) {
    return (
      <LockGate
        title="Trade Analyzer"
        blurb="Know if a trade helps you before you hit accept."
        bullets={["Letter grade and clear verdict", "Who wins and why", "Counter-offer guidance when it is close"]}
        onSee={() => go("upgrade")}
      />
    );
  }

  const winnerText = result && ({ you: "You come out ahead", them: "They come out ahead", even: "Roughly even value" }[result.winner] || "");

  return (
    <div className="fadeup">
      <h1 className="font-display font-900 text-2xl">Trade Analyzer</h1>
      <p className="text-sm text-mut mt-1">Add both sides of the deal.</p>

      <Card className="p-4 mt-4">

        <PlayerListEditor players={give} setPlayers={setGive} accent="bad" namePlaceholder="Player you send" />
      </Card>
      <div className="flex justify-center my-2 text-mut"><I.swap className="w-6 h-6" /></div>
      <Card className="p-4">
        <p className="font-display font-800 text-sm text-good mb-2">You get</p>
        <PlayerListEditor players={get} setPlayers={setGet} accent="good" namePlaceholder="Player you receive" />
      </Card>

      <Card className="p-4 mt-3">
        <label className="text-[11px] text-mut font-semibold">Scoring</label>
        <select value={format} onChange={(e) => setFormat(e.target.value)} className="mt-1 w-full bg-ink border border-line rounded-lg px-3 py-2.5 text-sm font-semibold">
          {["PPR", "Half PPR", "Standard"].map((f) => <option key={f}>{f}</option>)}
        </select>
        <button
          onClick={run}
          disabled={give.length < 1 || get.length < 1 || loading}
          className="mt-4 w-full bg-edge text-ink font-display font-800 rounded-lg py-3 disabled:opacity-40 flex items-center justify-center gap-2 active:scale-[.99] transition"
        >
          {loading ? <><Spinner className="w-5 h-5" /> Grading the deal</> : <>Grade trade <I.arrow className="w-4 h-4" /></>}
        </button>
        {(give.length < 1 || get.length < 1) && <p className="text-[11px] text-mut mt-2 text-center">Add at least one player to each side.</p>}
      </Card>

      {err && <div className="mt-4"><AIError msg={err} onRetry={run} /></div>}

      {result && (
        <div className="mt-4 fadeup">
          <Card className="p-4">
            <div className="flex items-center gap-4">
              <GradeBadge grade={result.grade} />
              <div className="flex-1">
                <VerdictPill v={result.verdict} />
                <p className="text-sm font-semibold mt-2">{winnerText}</p>
              </div>
            </div>
            <p className="text-sm text-mut mt-4 leading-relaxed">{result.summary}</p>
            {Array.isArray(result.keys) && result.keys.length > 0 && (
              <div className="mt-3 space-y-2 border-t border-line pt-3">
                {result.keys.map((k, i) => (
                  <div key={i} className="flex items-start gap-2">
                    <span className="text-edge mt-1">•</span>
                    <span className="text-sm text-fg">{k}</span>
                  </div>
                ))}
              </div>
            )}
            <Disclaimer />
          </Card>
        </div>
      )}

      {raw && <Card className="p-4 mt-4"><p className="text-sm text-fg whitespace-pre-wrap leading-relaxed">{raw}</p><Disclaimer /></Card>}
    </div>
  );
}

        <p className="text-sm text-mut mt-2 max-w-[32ch] mx-auto">Every tool is unlocked. Go win your matchup.</p>
        <button onClick={() => go("startsit")} className="mt-6 bg-edge text-ink font-display font-800 rounded-lg px-6 py-3">Open Start/Sit</button>
        <button onClick={() => setPro(false)} className="mt-4 block mx-auto text-[12px] text-mut underline">Reset to Free (testing)</button>
      </div>
    );
  }

  const feats = [
    "Unlimited Start/Sit calls",
    "Unlimited trade grades",
    "Personalized waiver reports",
    "FAAB bid and drop suggestions",
    "PPR, half PPR, and standard",
  ];

  return (
    <div className="fadeup">
      <h1 className="font-display font-900 text-2xl">Go Pro</h1>
      <p className="text-sm text-mut mt-1">One decision a week can flip a whole season.</p>

      {/* Plan toggle */}
      <div className="mt-4 grid grid-cols-2 gap-3">
        {["annual", "monthly"].map((k) => {
          const p = PRICING[k];
          const active = plan === k;
          return (
            <button key={k} onClick={() => setPlan(k)} className={"text-left rounded-xl border p-4 transition " + (active ? "border-edge bg-edge/10" : "border-line bg-panel")}>
              <div className="flex items-center justify-between">
                <span className="text-sm font-semibold">{p.label}</span>
                {p.note && <span className="text-[10px] font-800 text-edge bg-edge/15 rounded px-1.5 py-0.5">{p.note}</span>}
              </div>
              <div className="mt-2 flex items-baseline gap-1">
                <span className="font-display font-900 text-2xl">{p.price}</span>
                <span className="text-mut text-sm">{p.per}</span>
              </div>
            </button>
          );
        })}
      </div>

      <button onClick={subscribe} className="mt-4 w-full bg-edge text-ink font-display font-800 rounded-lg py-3.5 flex items-center justify-center gap-2 active:scale-[.99] transition">
        Start {PRICING[plan].label} <I.arrow className="w-4 h-4" />
      </button>

      <Card className="p-5 mt-5">
        <p className="font-display font-800 text-sm">Everything in Pro</p>
        <div className="mt-3 space-y-2.5">
          {feats.map((f, i) => (
            <div key={i} className="flex items-center gap-2.5">
              <I.check className="w-4 h-4 text-good shrink-0" />
              <span className="text-sm">{f}</span>
            </div>
          ))}
        </div>
      </Card>

      <p className="text-[11px] text-mut/80 mt-4 text-center leading-relaxed">
        Cancel anytime. Guidance is for entertainment and is not affiliated with the NFL or any fantasy platform.
      </p>

      {/* Testing only. Remove before launch, or gate behind real Stripe + Supabase verification. */}
      <button onClick={() => { setPro(true); go("home"); }} className="mt-5 w-full border border-line rounded-lg py-2.5 text-[12px] text-mut">
        Demo unlock (testing only)
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
