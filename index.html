  <style>
    :root {
      --bg: #080b10;
      --bg-soft: #0d1118;
      --surface: #111722;
      --surface-2: #171f2d;
      --surface-3: #202a3b;
      --border: rgba(255,255,255,.085);
      --border-strong: rgba(255,255,255,.15);
      --text: #f7f8fb;
      --muted: #8f9aab;
      --muted-2: #667184;
      --orange: #ff9f0a;
      --orange-2: #ff6b00;
      --orange-soft: rgba(255,159,10,.13);
      --green: #34d399;
      --green-soft: rgba(52,211,153,.12);
      --red: #fb7185;
      --red-soft: rgba(251,113,133,.11);
      --blue: #60a5fa;
      --blue-soft: rgba(96,165,250,.12);
      --purple: #a78bfa;
      --shadow: 0 22px 70px rgba(0,0,0,.42);
      --radius: 20px;
      --radius-sm: 14px;
      --display: "Space Grotesk", system-ui, -apple-system, sans-serif;
      --body: "Manrope", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        radial-gradient(900px 500px at 86% -5%, rgba(255,159,10,.12), transparent 58%),
        radial-gradient(700px 400px at -10% 25%, rgba(96,165,250,.07), transparent 58%),
        var(--bg);
      color: var(--text);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; }
    button { border: 0; }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
    }
    button:disabled { cursor: not-allowed; }
    ::selection { background: rgba(255,159,10,.28); }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #263247; border-radius: 999px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-track { background: transparent; }

    .app-shell { min-height: 100dvh; }
    .desktop-sidebar {
      display: none;
      position: fixed;
      inset: 0 auto 0 0;
      width: 250px;
      padding: 24px 18px;
      background: rgba(8,11,16,.92);

      backdrop-filter: blur(22px);

    .desktop-main { min-height: 100dvh; }
    .content-wrap { width: min(100%, 1180px); margin: 0 auto; padding: 18px 16px 110px; }

    .mobile-header {
      position: sticky;
      top: 0;
      z-index: 35;
      min-height: 66px;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(8,11,16,.98), rgba(8,11,16,.83));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(22px);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); background: transparent; cursor: pointer; }

    .pro-pill {
      display: inline-flex;

      gap: 7px;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;

      color: #ffc45f;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      cursor: pointer;
    }
    .pro-pill.active { color: var(--green); border-color: rgba(52,211,153,.28); background: var(--green-soft); }

    .sidebar-brand { padding: 3px 8px 24px; }
    .sidebar-nav { display: grid; gap: 6px; }
    .nav-button {
      width: 100%;
      min-height: 48px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 13px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      cursor: pointer;
      transition: .18s ease;
    }
    .nav-button:hover { color: var(--text); background: rgba(255,255,255,.035); }
    .nav-button.active { color: var(--text); background: linear-gradient(90deg, rgba(255,159,10,.16), rgba(255,159,10,.05)); box-shadow: inset 0 0 0 1px rgba(255,159,10,.17); }
    .nav-button.active svg { color: var(--orange); }
    .nav-button svg { width: 21px; height: 21px; }
    .sidebar-bottom { position: absolute; left: 18px; right: 18px; bottom: 22px; }
    .sidebar-card { padding: 16px; border-radius: 16px; background: linear-gradient(145deg, rgba(255,159,10,.12), rgba(255,255,255,.025)); border: 1px solid rgba(255,159,10,.18); }

    .mobile-nav {
      position: fixed;
      inset: auto 0 0 0;
      z-index: 50;
      padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
      background: rgba(12,16,23,.92);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(24px);

    .mobile-nav-inner { max-width: 620px; margin: auto; display: grid; grid-template-columns: repeat(5, 1fr); }
    .mobile-tab {
      min-height: 52px;
      border-radius: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      color: var(--muted-2);
      cursor: pointer;
    }
    .mobile-tab.active { color: var(--orange); background: rgba(255,159,10,.07); }
    .mobile-tab svg { width: 23px; height: 23px; }
    .mobile-tab span { font-size: 9.5px; font-weight: 800; }

    .page { animation: pageIn .34s ease both; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    @keyframes glow { 0%,100% { box-shadow: 0 0 0 rgba(255,159,10,0); } 50% { box-shadow: 0 0 28px rgba(255,159,10,.15); } }


    /* 10/10 presentation layer */
    .aurora { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }
    .aurora::before, .aurora::after { content:""; position:absolute; width:520px; height:520px; border-radius:50%; filter: blur(100px); opacity:.12; animation: drift 16s ease-in-out infinite alternate; }
    .aurora::before { background:#ff8a00; right:-220px; top:8%; }
    .aurora::after { background:#2563eb; left:-280px; bottom:0; animation-delay:-7s; }
    @keyframes drift { to { transform: translate3d(45px,-35px,0) scale(1.12); } }
    .hero { isolation:isolate; box-shadow: 0 35px 90px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.05); }
    .hero::after { content:""; position:absolute; inset:auto -10% -54% 38%; height:80%; background:radial-gradient(closest-side,rgba(255,142,0,.24),transparent); filter:blur(18px); z-index:-1; }
    .hero-field { position:absolute; right:-52px; bottom:-30px; width:330px; height:235px; transform:perspective(700px) rotateX(58deg) rotateZ(-14deg); border:1px solid rgba(255,181,71,.28); border-radius:30px; background:linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(145deg,rgba(255,159,10,.1),rgba(5,8,13,.72)); background-size:34px 100%,100% 34px,100% 100%; box-shadow:0 0 70px rgba(255,122,0,.12),inset 0 0 60px rgba(255,159,10,.05); opacity:.86; }
    .hero-field::before { content:"50"; position:absolute; inset:50% auto auto 50%; transform:translate(-50%,-50%); font:800 64px/1 var(--display); color:rgba(255,255,255,.055); }
    .hero-field::after { content:""; position:absolute; left:50%; top:0; bottom:0; border-left:2px dashed rgba(255,255,255,.11); }
    .football { position:absolute; right:105px; bottom:79px; width:62px; height:36px; border-radius:55% 55% 55% 55% / 50% 50% 50% 50%; transform:rotate(-25deg); background:linear-gradient(145deg,#ffb341,#d86500); box-shadow:0 18px 34px rgba(0,0,0,.35),0 0 28px rgba(255,159,10,.24); z-index:2; animation:footballFloat 4s ease-in-out infinite; }
    .football::before { content:""; position:absolute; width:26px; left:18px; top:16px; border-top:2px solid rgba(255,255,255,.78); box-shadow:-5px -5px 0 -4px #fff,5px -5px 0 -4px #fff; }
    @keyframes footballFloat { 50% { transform:rotate(-18deg) translateY(-8px); } }
    .signal-ticker { margin-top:14px; overflow:hidden; border:1px solid var(--border); border-radius:14px; background:rgba(255,255,255,.025); }
    .ticker-track { width:max-content; display:flex; gap:34px; padding:10px 20px; animation:ticker 26s linear infinite; }
    .ticker-item { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.08em; white-space:nowrap; text-transform:uppercase; }
    .ticker-item b { color:var(--green); margin-right:7px; }
    @keyframes ticker { to { transform:translateX(-50%); } }
    .command-grid { display:grid; grid-template-columns:1fr; gap:14px; margin-top:14px; }
    .command-card { padding:18px; min-height:205px; }
    .command-card.primary { background:linear-gradient(145deg,rgba(255,159,10,.13),rgba(16,22,32,.96) 55%); border-color:rgba(255,159,10,.2); }
    .command-kicker { color:var(--orange); font-size:9px; font-weight:900; letter-spacing:.14em; text-transform:uppercase; }
    .command-title { margin-top:7px; font:700 21px/1.1 var(--display); letter-spacing:-.04em; }
    .progress-ring { --value:72; width:92px; height:92px; border-radius:50%; display:grid; place-items:center; background:conic-gradient(var(--orange) calc(var(--value)*1%),rgba(255,255,255,.07) 0); position:relative; flex:none; }
    .progress-ring::before { content:""; position:absolute; inset:7px; border-radius:50%; background:#111722; }
    .progress-ring span { position:relative; z-index:1; font:700 24px/1 var(--display); }
    .progress-ring small { display:block; color:var(--muted); font:800 8px/1 var(--body); letter-spacing:.08em; margin-top:5px; }
    .game-plan { display:grid; gap:10px; margin-top:17px; }
    .plan-row { display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:center; }
    .plan-number { width:28px; height:28px; display:grid; place-items:center; border-radius:9px; background:rgba(255,255,255,.045); border:1px solid var(--border); color:var(--orange); font:800 10px/1 var(--display); }
    .plan-label { font-size:11px; font-weight:800; }
    .plan-meta { color:var(--muted); font-size:9px; font-weight:700; }
    .mini-chart { height:74px; display:flex; align-items:end; gap:6px; margin-top:20px; }
    .mini-chart span { flex:1; min-width:8px; border-radius:6px 6px 2px 2px; background:linear-gradient(to top,rgba(255,107,0,.3),#ffad24); box-shadow:0 0 18px rgba(255,159,10,.09); animation:barIn .7s cubic-bezier(.2,.8,.2,1) both; transform-origin:bottom; }
    @keyframes barIn { from { transform:scaleY(0); opacity:0; } }
    .player-tile { box-shadow:0 18px 40px rgba(0,0,0,.16); }
    .player-tile::after { content:""; position:absolute; inset:auto 0 0; height:2px; background:linear-gradient(90deg,transparent,var(--orange),transparent); opacity:.45; }
    @media (min-width:760px) { .command-grid { grid-template-columns:1.35fr .65fr; } }
    @media (max-width:640px) { .hero-field { right:-155px; opacity:.56; } .football { right:32px; bottom:52px; opacity:.9; } .hero-copy { max-width:88%; } }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }

    .eyebrow { color: var(--orange); font: 800 10px/1.2 var(--body); letter-spacing: .16em; text-transform: uppercase; }
    .page-title { margin: 7px 0 0; font: 700 clamp(28px, 7vw, 46px)/1.02 var(--display); letter-spacing: -.055em; }
    .page-subtitle { margin: 10px 0 0; max-width: 650px; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .section-head { margin-bottom: 13px; display: flex; align-items: end; justify-content: space-between; gap: 14px; }
    .section-title { margin: 0; font: 700 17px/1.2 var(--display); letter-spacing: -.025em; }
    .section-note { color: var(--muted); font-size: 12px; }

    .card {
      position: relative;
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(22,29,42,.92), rgba(15,20,29,.92));
      border: 1px solid var(--border);
      box-shadow: 0 18px 45px rgba(0,0,0,.14);
      overflow: hidden;
    }
    .card-hover { transition: transform .18s ease, border-color .18s ease, background .18s ease; }
    .card-hover:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.14); }
    .glass-card { background: rgba(17,23,34,.74); backdrop-filter: blur(18px); }
    .card-pad { padding: 17px; }
    .divider { height: 1px; background: var(--border); }
    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: 1fr; }
    .grid-3 { grid-template-columns: 1fr; }
    .stack { display: grid; gap: 12px; }
    .row { display: flex; align-items: center; }
    .between { justify-content: space-between; }
    .gap-6 { gap: 6px; } .gap-8 { gap: 8px; } .gap-10 { gap: 10px; } .gap-12 { gap: 12px; } .gap-14 { gap: 14px; }
    .min-0 { min-width: 0; }
    .grow { flex: 1; }
    .truncate { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .muted { color: var(--muted); }
    .tiny { font-size: 10px; }
    .small { font-size: 12px; }
    .body-sm { font-size: 13px; line-height: 1.6; }
    .strong { font-weight: 800; }
    .display { font-family: var(--display); }
    .tabular { font-variant-numeric: tabular-nums; }

    .hero {
      min-height: 310px;
      padding: 23px 20px;
      background:
        linear-gradient(130deg, rgba(255,159,10,.16), transparent 46%),
        radial-gradient(500px 280px at 87% 10%, rgba(255,107,0,.16), transparent 58%),
        linear-gradient(145deg, #171e2a, #0f141d);
      border-color: rgba(255,159,10,.18);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .24;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to right, transparent, black 30%, black);
      pointer-events: none;
    }
    .hero-copy { position: relative; z-index: 2; max-width: 620px; }
    .hero-title { margin: 12px 0 0; max-width: 700px; font: 700 clamp(36px, 10vw, 67px)/.92 var(--display); letter-spacing: -.07em; }
    .hero-title em { color: var(--orange); font-style: normal; }
    .hero-subtitle { max-width: 590px; color: #aeb7c5; font-size: 14px; line-height: 1.65; margin: 16px 0 0; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 21px; }
    .hero-orb {
      position: absolute;
      right: -48px;
      bottom: -67px;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      border: 1px solid rgba(255,159,10,.23);
      background: radial-gradient(circle at 35% 30%, rgba(255,196,95,.17), rgba(255,159,10,.035) 42%, transparent 67%);
      box-shadow: inset 0 0 70px rgba(255,159,10,.05);
    }
    .hero-orb::before, .hero-orb::after { content: ""; position: absolute; inset: 20%; border: 1px dashed rgba(255,159,10,.25); border-radius: 50%; }
    .hero-orb::after { inset: 38%; border-style: solid; background: rgba(255,159,10,.06); }
    .live-chip { display: inline-flex; align-items: center; gap: 7px; color: #ffd38a; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px rgba(52,211,153,.09); animation: pulse 1.8s ease infinite; }

    .button {
      min-height: 45px;
      border-radius: 13px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease, border-color .15s ease;
    }
    .button:hover { filter: brightness(1.08); border-color: var(--border-strong); }
    .button:active { transform: scale(.985); }
    .button svg { width: 17px; height: 17px; }
    .button-primary { color: #121212; border-color: rgba(255,178,38,.5); background: linear-gradient(135deg, #ffb31a, #ff8100); box-shadow: 0 12px 30px rgba(255,128,0,.18); }

    .button-block { width: 100%; }
    .button-small { min-height: 35px; padding: 0 12px; font-size: 11px; border-radius: 10px; }

    .metric-grid { margin-top: 14px; grid-template-columns: repeat(2, minmax(0,1fr)); }
    .metric-card { min-height: 112px; padding: 15px; }

    .metric-icon svg { width: 18px; height: 18px; }
    .metric-value { margin-top: 14px; font: 700 24px/1 var(--display); letter-spacing: -.04em; }
    .metric-label { margin-top: 5px; color: var(--muted); font-size: 10px; font-weight: 700; }
    .metric-trend { color: var(--green); font-size: 10px; font-weight: 800; }

    .tool-card { min-height: 150px; padding: 17px; text-align: left; cursor: pointer; color: var(--text); }
    .tool-card.featured { min-height: 190px; background: linear-gradient(145deg, rgba(255,159,10,.13), rgba(17,23,34,.94) 52%); border-color: rgba(255,159,10,.2); }

    function safeParse(value, fallback) {
      try { return JSON.parse(value); } catch { return fallback; }
    }
    function readStorage(key, fallback) {
      try { const value = localStorage.getItem(key); return value == null ? fallback : safeParse(value, fallback); } catch { return fallback; }
    }
    function writeStorage(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }
    function clamp(value, min, max) { return Math.min(max, Math.max(min, value)); }
    function hashString(value) {
      let h = 2166136261;
      const text = String(value || "");
      for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
      return (h >>> 0) / 4294967295;
    }
    function titleCase(value) { return String(value || "").toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); }
    function withTimeout(promise, ms = 10000) {
      return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error("Request timed out")), ms))]);
    }
    function formatNumber(value) { return Number(value || 0).toLocaleString(); }
    function currentGreeting() {
      const h = new Date().getHours();
      return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
    }
    function getPositionBase(pos) {
      return { QB: 19.2, RB: 12.6, WR: 12.2, TE: 9.7, K: 8.4, DEF: 8.1 }[pos] || 10;
    }
    function playerValue(player, mode = "redraft") {
      const posMultiplier = { QB: .95, RB: 1.2, WR: 1.15, TE: 1.0, K: .48, DEF: .52 }[player.pos] || .8;
      const seed = hashString(player.name + player.pos + mode);
      const dynasty = mode === "dynasty" ? (.88 + hashString(player.name + "age") * .28) : 1;
      return Math.round((55 + seed * 45) * posMultiplier * dynasty);
    }
    function rosterNeeds(roster) {
      const desired = { QB: 2, RB: 5, WR: 5, TE: 2, K: 1, DEF: 1 };
      return Object.entries(desired).map(([pos, target]) => ({ pos, count: roster.filter(p => p.pos === pos).length, target })).sort((a,b) => (a.count/a.target) - (b.count/b.target));
    }

    async function fetchJson(url, options = {}, timeout = 10000) {
      const response = await withTimeout(fetch(url, options), timeout);
      if (!response.ok) throw new Error(`Network request failed (${response.status})`);
      return response.json();
    }

    let playerMapCache = null;
    async function fetchTrendingPlayers() {
      const adds = await fetchJson("https://api.sleeper.app/v1/players/nfl/trending/add?lookback_hours=72&limit=18", {}, 9000);
      if (!Array.isArray(adds) || adds.length === 0) throw new Error("No trending players returned");
      if (!playerMapCache) playerMapCache = await fetchJson("https://api.sleeper.app/v1/players/nfl", {}, 15000);
      const result = adds.map(item => {
        const p = playerMapCache[item.player_id];
        if (!p) return null;
        const name = p.full_name || `${p.first_name || ""} ${p.last_name || ""}`.trim();
        return { id: item.player_id, name: name || item.player_id, pos: p.position || "?", team: p.team || "FA", count: item.count || 0 };
      }).filter(Boolean);
      if (!result.length) throw new Error("Player information unavailable");
      return result;
    }

    function playerImage(id) { return id ? `https://sleepercdn.com/content/nfl/players/${id}.jpg` : ""; }

    async function callAI(task, context) {
      if (!CONFIG.aiProxyUrl) return null;
      const response = await fetchJson(CONFIG.aiProxyUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task, context })
      }, 18000);
      return response?.result ?? response?.output ?? response;
    }

    function localStartSit(players, settings) {
      const scoringBonus = settings.format === "PPR" ? { RB: .7, WR: 1.2, TE: 1.0 } : settings.format === "Half PPR" ? { RB: .35, WR: .6, TE: .5 } : {};
      const ranking = players.map((player, index) => {
        const seed = hashString(`${player.name}|${player.pos}|${player.opp}|${settings.week}`);
        const matchup = hashString(`${player.opp || "neutral"}|${player.pos}`);
        const base = getPositionBase(player.pos) + (scoringBonus[player.pos] || 0);
        const projected = clamp(base + (seed - .5) * 7 + (matchup - .5) * 3.4, 3, 31);
        const volatility = { QB: 5.2, RB: 5.8, WR: 6.4, TE: 4.8, K: 3.4, DEF: 4.2 }[player.pos] || 5;
        const confidence = Math.round(clamp(70 + Math.abs(seed - .5) * 35 + Math.abs(matchup - .5) * 15, 62, 94));
        const matchupLabel = matchup > .67 ? "plus matchup" : matchup < .33 ? "difficult matchup" : "neutral matchup";
        const volumeLabel = seed > .65 ? "strong projected volume" : seed < .35 ? "volatile opportunity" : "stable weekly role";
        return {
          player: player.name,
          pos: player.pos,
          team: player.team || "",
          projected: Number(projected.toFixed(1)),
          floor: Number(Math.max(1, projected - volatility).toFixed(1)),
          ceiling: Number((projected + volatility + seed * 2.5).toFixed(1)),
          confidence,
          matchup: matchupLabel,
          reasons: [
            `${titleCase(matchupLabel)} for a ${player.pos} in ${settings.format} scoring.`,
            `${titleCase(volumeLabel)} creates a ${projected >= base ? "favorable" : "fragile"} projection profile.`,
            player.opp ? `Opponent context (${player.opp}) is included in this decision score.` : "Add an opponent for sharper matchup context."
          ],
          originalIndex: index
        };
      }).sort((a,b) => b.projected - a.projected);
      ranking.forEach((p, index) => { p.verdict = index === 0 ? "START" : index === 1 && ranking.length > 2 ? "FLEX" : "SIT"; });
      const top = ranking[0];
      return {
        source: "Snap Intelligence",
        summary: `${top.player} leads this group with the strongest blend of projected volume, scoring environment and weekly ceiling.`,
        ranking
      };
    }

    function localTrade(give, receive, settings) {
      const mode = settings.mode || "redraft";
      const giveValue = give.reduce((sum,p) => sum + playerValue(p, mode), 0);
      const receiveValue = receive.reduce((sum,p) => sum + playerValue(p, mode), 0);
      const total = Math.max(1, giveValue + receiveValue);
      const rawLeftPct = Math.round(giveValue / total * 100);
      const leftPct = clamp(rawLeftPct, 18, 82);
      const rightPct = 100 - leftPct;
      const difference = receiveValue - giveValue;
      const pct = difference / Math.max(1, giveValue) * 100;
      let grade = "C", verdict = "COUNTER";
      if (pct >= 28) { grade = "A"; verdict = "ACCEPT"; }
      else if (pct >= 16) { grade = "A-"; verdict = "ACCEPT"; }
      else if (pct >= 7) { grade = "B+"; verdict = "ACCEPT"; }
      else if (pct >= 1) { grade = "B"; verdict = "ACCEPT"; }
      else if (pct > -7) { grade = "C+"; verdict = "COUNTER"; }
      else if (pct > -17) { grade = "C-"; verdict = "COUNTER"; }
      else if (pct > -28) { grade = "D"; verdict = "DECLINE"; }
      else { grade = "F"; verdict = "DECLINE"; }
      const winner = difference > 4 ? "You" : difference < -4 ? "Opponent" : "Even";
      const giveTop = [...give].sort((a,b) => playerValue(b,mode)-playerValue(a,mode))[0];
      const receiveTop = [...receive].sort((a,b) => playerValue(b,mode)-playerValue(a,mode))[0];
      const counter = verdict === "COUNTER" ? `Ask for a usable depth piece or roughly ${Math.max(5, Math.round(Math.abs(difference) * .55))} additional value points.` : verdict === "DECLINE" ? `A counter should add a meaningful starter to the ${receiveTop?.name || "receive"} side.` : "The value is strong enough to accept without over-optimizing the final few points.";
      return {
        source: "Snap Intelligence",
        grade, verdict, winner, giveValue, receiveValue,
        leftPct,
        rightPct,
        summary: `${winner === "You" ? "You gain" : winner === "Opponent" ? "You give away" : "The deal exchanges"} approximately ${Math.abs(difference)} model value points. ${receiveTop?.name || "The incoming side"} is the most important asset in the return.`,
        keys: [
          `${mode === "dynasty" ? "Long-term" : "Rest-of-season"} value favors the ${difference >= 0 ? "incoming" : "outgoing"} package.`,
          `${giveTop?.name || "Your top outgoing player"} carries the highest cost on the side you send.`,
          `Your selected ${settings.format} format is included in the positional weighting.`
        ],
        counter
      };
    }

    function localWaivers(roster, trending, settings) {
      const needs = rosterNeeds(roster);
      const needScore = Object.fromEntries(needs.map((n,i) => [n.pos, 6-i]));
      const pickups = trending.slice(0,10).map(player => {
        const momentum = Math.log10(Math.max(10, player.count));
        const upside = hashString(player.name + player.team);
        const priority = clamp(Math.round((needScore[player.pos] || 2) * .62 + momentum * .56 + upside), 1, 5);
        const bid = clamp(Math.round(priority * 3 + upside * 8), 2, 25);
        const dropPool = roster.filter(p => p.pos === player.pos).sort((a,b) => playerValue(a)-playerValue(b));
        return {
          ...player,
          priority,
          faab: `${bid}%`,
          reason: `${needScore[player.pos] >= 5 ? "Addresses a clear roster need" : "Adds bench upside"} while carrying top-${Math.max(3, Math.round(12-upside*7))} add momentum.`,
          drop: dropPool[0]?.name || `your lowest-upside ${player.pos} reserve`,
          score: priority * 20 + momentum * 3 + upside * 10
        };
      }).sort((a,b) => b.score - a.score).slice(0,5);
      const topNeed = needs[0];
      return {
        source: "Snap Intelligence",
        summary: roster.length ? `Your roster's clearest depth need is ${topNeed.pos}. Prioritize players who add immediate usage without sacrificing a core starter.` : "With no roster saved, this report prioritizes broad market momentum and upside.",
        pickups
      };
    }

    async function analyzeWithFallback(task, context) {
      try {
        const remote = await callAI(task, context);
        if (remote && typeof remote === "object") return { ...remote, source: remote.source || "Connected AI" };
      } catch (error) {
        console.warn("Connected AI unavailable; using local engine.", error);
      }
      if (task === "startsit") return localStartSit(context.players, context.settings);
      if (task === "trade") return localTrade(context.give, context.receive, context.settings);
      if (task === "waivers") return localWaivers(context.roster, context.trending, context.settings);
      throw new Error("Unknown analysis task");
    }

    function PlayerEditor({ players, setPlayers, opponent = false, placeholder = "Player name", addLabel = "Add player" }) {

              <div className="plan-row"><span className="plan-number">01</span><div><div className="plan-label">Lock your highest-confidence starters</div><div className="plan-meta">Use Start/Sit Intelligence before lineup lock</div></div><Icon.arrow style={{width:15,color:"var(--orange)"}} /></div>
              <div className="plan-row"><span className="plan-number">02</span><div><div className="plan-label">Attack your thinnest roster position</div><div className="plan-meta">Current model: {rosterNeeds(roster)[0]?.pos || "RB"} depth deserves attention</div></div><Icon.arrow style={{width:15,color:"var(--orange)"}} /></div>
              <div className="plan-row"><span className="plan-number">03</span><div><div className="plan-label">Keep one upside bench slot flexible</div><div className="plan-meta">Preserve optionality for late news</div></div><Icon.arrow style={{width:15,color:"var(--orange)"}} /></div>
            </div>
          </Card>
          <Card className="command-card">
            <div className="command-kicker">Decision confidence</div><div className="command-title" style={{fontSize:18}}>Weekly signal strength</div>
            <div className="mini-chart" aria-label="Signal strength chart">{[38,54,47,68,61,82,74,91].map((h,index)=><span key={index} style={{height:h+"%",animationDelay:(index*.06)+"s"}} />)}</div>
            <div className="row between" style={{marginTop:12}}><span className="tiny muted">MODEL COVERAGE</span><span className="small strong" style={{color:"var(--green)"}}>STRONG</span></div>
          </Card>
        </div>

        <section style={{marginTop:27}}>
          <div className="section-head"><div><h2 className="section-title">Decision suite</h2><div className="section-note">High-leverage tools for this week</div></div>{!isPro ? <Button small variant="ghost" onClick={() => go("upgrade")}>View Pro <Icon.arrow /></Button> : null}</div>
          <div className="grid tool-layout">
            <Card as="button" className="tool-card featured card-hover" onClick={() => go("startsit")}>
              <div className="row between"><span className="tool-icon"><Icon.scale /></span>{!isPro ? <span className="lock-badge"><Icon.lock />PRO</span> : <StatusPill ai>READY</StatusPill>}</div>
              <div className="tool-title">Start/Sit Intelligence</div><div className="tool-desc">Rank every option with projections, floor, ceiling, matchup context and a decisive recommendation.</div>
            </Card>
            <Card as="button" className="tool-card card-hover" onClick={() => go("trade")}><div className="row between"><span className="tool-icon"><Icon.swap /></span>{!isPro ? <span className="lock-badge"><Icon.lock />PRO</span> : null}</div><div className="tool-title">Trade Lab</div><div className="tool-desc">Model package value, identify the winner and create a counter strategy.</div></Card>
            <Card as="button" className="tool-card card-hover" onClick={() => go("waivers")}><div className="row between"><span className="tool-icon"><Icon.target /></span>{!isPro ? <span className="lock-badge"><Icon.lock />PRO</span> : null}</div><div className="tool-title">Waiver Radar</div><div className="tool-desc">Convert live add momentum into roster-specific claims and FAAB bids.</div></Card>
          </div>
        </section>

        <section style={{marginTop:27}}>
          <div className="section-head"><div><h2 className="section-title">Market pulse</h2><div className="section-note">Most-added players across Sleeper leagues</div></div><StatusPill live={trendState.live}>{trendState.loading ? "SYNCING" : trendState.live ? "LIVE" : "SAMPLE"}</StatusPill></div>
          {trendState.loading ? <div className="trending-strip">{[1,2,3,4].map(i => <div key={i} className="card skeleton" style={{minWidth:150,height:154}} />)}</div> : <div className="trending-strip">{top.map((player,index) => <Card key={`${player.name}-${index}`} className="player-tile card-hover">
            <div className="row between"><Avatar player={player} /><span className="adds">+{formatNumber(player.count)}</span></div>
            <div className="strong small truncate" style={{marginTop:12}}>{player.name}</div>
            <div className="row gap-6" style={{marginTop:6}}><PositionChip pos={player.pos} /><span className="team-chip">{player.team}</span></div>
          </Card>)}</div>}
        </section>
        <div className="footer-note">SNAPCOUNT is an independent fantasy-football decision product and is not affiliated with the NFL or any fantasy platform. Always confirm official inactive and injury news before lineup lock.</div>
      </div>;
    }

    function PremiumGate({ title, description, bullets, go }) {
      return <Card className="empty-state">
        <div className="empty-icon" style={{color:"var(--orange)",background:"var(--orange-soft)",borderColor:"rgba(255,159,10,.2)"}}><Icon.lock /></div>
        <h2 className="display" style={{fontSize:22,letterSpacing:"-.04em",margin:"16px 0 7px"}}>{title}</h2>
        <p className="body-sm muted" style={{maxWidth:430,margin:"0 auto"}}>{description}</p>
        <div className="stack" style={{maxWidth:370,margin:"20px auto",textAlign:"left"}}>{bullets.map((bullet,index) => <div className="feature-row" key={index}><span className="feature-check"><Icon.check /></span><span className="small">{bullet}</span></div>)}</div>
        <Button variant="primary" onClick={() => go("upgrade")}>Unlock SNAPCOUNT Pro <Icon.arrow /></Button>
      </Card>;
    }

    function StartSit({ isPro, go, settings, setSettings }) {
      const [players, setPlayers] = useState([]);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [error, setError] = useState("");
      async function run() {
        if (players.length < 2) return;
        setLoading(true); setError(""); setResult(null);
        try { setResult(await analyzeWithFallback("startsit", {players,settings})); }
        catch (e) { setError(e.message || "Analysis failed"); }
        finally { setLoading(false); }
      }
      if (!isPro) return <div className="page"><PremiumGate title="Start/Sit Intelligence" description="Stop choosing by instinct alone. Rank every option with a complete decision profile." bullets={["Projected points, floor and ceiling", "Matchup and opportunity analysis", "Clear START, FLEX and SIT recommendations", "Works even before your AI backend is connected"]} go={go} /></div>;
      return <div className="page">
        <div className="eyebrow">WEEKLY DECISION ENGINE</div><h1 className="page-title">Start/Sit Intelligence</h1><p className="page-subtitle">Add two or more players. SNAPCOUNT will rank them using scoring format, matchup context, projection range and opportunity profile.</p>
        <div className="dashboard-layout" style={{marginTop:20}}>
          <div>
            <Card className="card-pad">
              <PlayerEditor players={players} setPlayers={setPlayers} opponent placeholder="Search or type a player" />
              <div className="form-grid" style={{marginTop:15}}>
                <div className="field"><label>Scoring format</label><select className="select" value={settings.format} onChange={e => setSettings({...settings,format:e.target.value})}>{["PPR","Half PPR","Standard"].map(v => <option key={v}>{v}</option>)}</select></div>
                <div className="field"><label>Week</label><select className="select" value={settings.week} onChange={e => setSettings({...settings,week:Number(e.target.value)})}>{Array.from({length:18},(_,i)=>i+1).map(w => <option key={w} value={w}>Week {w}</option>)}</select></div>
              </div>
              <Button variant="primary" block onClick={run} disabled={players.length < 2 || loading} style={{marginTop:15}}>{loading ? <><Spinner />Analyzing decision</> : <>Generate ranked call <Icon.spark /></>}</Button>
              {players.length < 2 ? <div className="tiny muted" style={{textAlign:"center",marginTop:8}}>Add at least two players to begin.</div> : null}
            </Card>
            {error ? <Card className="card-pad" style={{marginTop:13,borderColor:"rgba(251,113,133,.24)"}}><div className="strong small" style={{color:"var(--red)"}}>Analysis unavailable</div><div className="body-sm muted" style={{marginTop:5}}>{error}</div><Button small onClick={run} style={{marginTop:10}}><Icon.refresh />Try again</Button></Card> : null}
          </div>
          <div className="desktop-sticky">
            {!result && !loading ? <Card className="empty-state"><div className="empty-icon"><Icon.scale /></div><div className="display strong" style={{marginTop:13}}>Your decision board</div><p className="body-sm muted" style={{margin:"7px auto 0",maxWidth:280}}>The ranked recommendation will appear here with confidence and projection ranges.</p></Card> : null}
            {loading ? <div className="stack">{[1,2,3].map(i => <Card key={i} className="skeleton" style={{height:170}} />)}</div> : null}
          </div>
        </div>
        {result ? <div style={{marginTop:18}}>
          <Card className="result-hero"><div className="row between gap-12"><div><StatusPill ai>{result.source || "ANALYSIS"}</StatusPill><h2 className="section-title" style={{marginTop:12,fontSize:20}}>The call</h2><p className="body-sm muted" style={{margin:"7px 0 0"}}>{result.summary}</p></div><Icon.trophy style={{width:42,color:"var(--orange)",flex:"none"}} /></div></Card>
          <div className="grid grid-2" style={{marginTop:13}}>{(result.ranking || []).map((player,index) => <Card className="card-pad" key={`${player.player}-${index}`}>
            <div className="row gap-12"><span className="result-rank">{index+1}</span><div className="grow min-0"><div className="row gap-8"><PositionChip pos={player.pos}/><div className="strong truncate">{player.player}</div></div><div className="tiny muted" style={{marginTop:4}}>{player.matchup || "Matchup modeled"}</div></div><Verdict value={player.verdict}/></div>
            <div className="row gap-10" style={{marginTop:15}}><div className="confidence-track grow"><div className="confidence-fill" style={{width:`${player.confidence || 75}%`}} /></div><span className="tiny strong tabular">{player.confidence || 75}%</span></div>
            <div className="projection-grid"><div className="projection-cell"><div className="projection-value tabular">{player.floor ?? "—"}</div><div className="projection-label">Floor</div></div><div className="projection-cell"><div className="projection-value tabular" style={{color:"var(--orange)"}}>{player.projected ?? "—"}</div><div className="projection-label">Projection</div></div><div className="projection-cell"><div className="projection-value tabular">{player.ceiling ?? "—"}</div><div className="projection-label">Ceiling</div></div></div>
            <div className="reason-list">{(player.reasons || [player.reason]).filter(Boolean).map((reason,i) => <div className="reason-item" key={i}><span className="reason-dot"/><span>{reason}</span></div>)}</div>
          </Card>)}</div>
          <p className="disclaimer">Decision models are estimates, not guarantees. Confirm late injury, inactive, weather and depth-chart information before lineup lock.</p>
        </div> : null}
      </div>;
    }

    function TradeAnalyzer({ isPro, go, settings }) {
      const [give, setGive] = useState([]);
      const [receive, setReceive] = useState([]);
      const [mode, setMode] = useState("redraft");
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      async function run() {
        if (!give.length || !receive.length) return;
        setLoading(true); setResult(null);
        try { setResult(await analyzeWithFallback("trade", {give,receive,settings:{...settings,mode}})); }
        finally { setLoading(false); }
      }
      if (!isPro) return <div className="page"><PremiumGate title="Trade Lab" description="Evaluate the full package—not just the biggest name—and know exactly how to respond." bullets={["Letter grade and winner", "Redraft or dynasty weighting", "Package value visualization", "Actionable counter-offer guidance"]} go={go} /></div>;
      const gradeClass = result ? (["A","B"].includes(String(result.grade).charAt(0)) ? "" : String(result.grade).charAt(0)==="C" ? "mid" : "bad") : "";
      return <div className="page">
        <div className="eyebrow">PACKAGE VALUE MODEL</div><h1 className="page-title">Trade Lab</h1><p className="page-subtitle">Build both sides of the deal. SNAPCOUNT scores asset quality, package depth, positional weighting and format impact.</p>
        <div className="segmented" style={{marginTop:18,maxWidth:390}}>{["redraft","dynasty"].map(v => <button key={v} className={`segment ${mode===v?"active":""}`} onClick={() => setMode(v)}>{titleCase(v)}</button>)}</div>
        <div className="grid grid-2" style={{marginTop:13}}>
          <Card className="card-pad"><div className="row gap-8" style={{marginBottom:12}}><span className="tool-icon" style={{width:31,height:31,color:"var(--red)",background:"var(--red-soft)",borderColor:"rgba(251,113,133,.18)"}}><Icon.arrow style={{transform:"rotate(180deg)"}}/></span><div><div className="strong small">You send</div><div className="tiny muted">Assets leaving your roster</div></div></div><PlayerEditor players={give} setPlayers={setGive} placeholder="Outgoing player" addLabel="Add to outgoing side" /></Card>
          <Card className="card-pad"><div className="row gap-8" style={{marginBottom:12}}><span className="tool-icon" style={{width:31,height:31,color:"var(--green)",background:"var(--green-soft)",borderColor:"rgba(52,211,153,.18)"}}><Icon.arrow /></span><div><div className="strong small">You receive</div><div className="tiny muted">Assets joining your roster</div></div></div><PlayerEditor players={receive} setPlayers={setReceive} placeholder="Incoming player" addLabel="Add to incoming side" /></Card>
        </div>
        <Button variant="primary" block onClick={run} disabled={!give.length || !receive.length || loading} style={{marginTop:13,maxWidth:520}}>{loading ? <><Spinner />Modeling trade</> : <>Grade this trade <Icon.spark /></>}</Button>
        {loading ? <Card className="skeleton" style={{height:250,marginTop:15}} /> : null}
        {result ? <Card className="card-pad" style={{marginTop:15}}>
          <div className="row gap-14"><div className={`grade-badge ${gradeClass}`}>{result.grade}</div><div className="grow"><div className="row gap-8"><Verdict value={result.verdict}/><StatusPill ai>{result.source || "MODEL"}</StatusPill></div><div className="display strong" style={{fontSize:19,marginTop:9}}>{result.winner === "You" ? "You win the value exchange" : result.winner === "Opponent" ? "The opponent wins the value exchange" : "The value is nearly even"}</div></div></div>
          <div style={{marginTop:20}}><div className="row between tiny muted" style={{marginBottom:7}}><span>You send · {result.giveValue}</span><span>You receive · {result.receiveValue}</span></div><div className="value-meter" style={{"--left":`${result.leftPct}%`,"--right":`${result.rightPct}%`}}><span/><span/></div></div>
          <p className="body-sm muted" style={{margin:"17px 0 0"}}>{result.summary}</p>
          <div className="divider" style={{margin:"17px 0"}} />
          <div className="stack">{(result.keys || []).map((key,index) => <div className="feature-row" key={index}><span className="feature-check"><Icon.check /></span><span className="small">{key}</span></div>)}</div>
          <Card className="card-pad" style={{marginTop:16,background:"rgba(255,159,10,.06)",borderColor:"rgba(255,159,10,.16)"}}><div className="row gap-8"><Icon.target style={{width:19,color:"var(--orange)"}}/><div className="strong small">Counter strategy</div></div><p className="body-sm muted" style={{margin:"8px 0 0"}}>{result.counter}</p></Card>
          <p className="disclaimer">Trade values are directional estimates. League settings, keeper rules, roster construction and manager preferences can materially change market value.</p>
        </Card> : null}
      </div>;
    }

    function Waivers({ isPro, go, roster, trending, trendState, reloadTrending, watchlist, toggleWatch, settings }) {
      const [query, setQuery] = useState("");
      const [position, setPosition] = useState("ALL");
      const [loading, setLoading] = useState(false);
      const [report, setReport] = useState(null);
      const filtered = trending.filter(p => (position === "ALL" || p.pos === position) && p.name.toLowerCase().includes(query.toLowerCase()));
      async function run() { setLoading(true); setReport(null); try { setReport(await analyzeWithFallback("waivers", {roster,trending,settings})); } finally { setLoading(false); } }
      return <div className="page">
        <div className="row between gap-12"><div><div className="eyebrow">LIVE ACQUISITION MARKET</div><h1 className="page-title">Waiver Radar</h1></div><Button small onClick={reloadTrending} disabled={trendState.loading}><Icon.refresh />Refresh</Button></div>
        <p className="page-subtitle">Track the market, filter by position and build a roster-specific claim plan with bid guidance.</p>
        <div className="form-grid" style={{marginTop:18}}><div className="field"><label>Search players</label><div style={{position:"relative"}}><Icon.search style={{position:"absolute",left:13,top:14,width:18,color:"var(--muted)"}}/><input className="input" style={{paddingLeft:40}} value={query} onChange={e => setQuery(e.target.value)} placeholder="Search market" /></div></div><div className="field"><label>Position</label><select className="select" value={position} onChange={e => setPosition(e.target.value)}>{["ALL",...POSITIONS].map(p => <option key={p}>{p}</option>)}</select></div></div>
        <div className="row between" style={{margin:"17px 0 10px"}}><div className="row gap-8"><h2 className="section-title">Trending adds</h2><StatusPill live={trendState.live}>{trendState.loading ? "SYNCING" : trendState.live ? "LIVE" : "SAMPLE"}</StatusPill></div><span className="tiny muted">{filtered.length} players</span></div>
        <div className="stack">
          {trendState.loading ? [1,2,3,4,5].map(i => <Card key={i} className="skeleton" style={{height:78}} />) : filtered.map((player,index) => { const saved = watchlist.some(p => p.name === player.name); return <Card className="waiver-row card-hover" key={`${player.name}-${index}`}><span className="rank">{index+1}</span><Avatar player={player}/><div className="grow min-0"><div className="row gap-8"><div className="strong small truncate">{player.name}</div><PositionChip pos={player.pos}/></div><div className="tiny muted" style={{marginTop:4}}>{player.team} · market momentum</div></div><div style={{textAlign:"right"}}><div className="adds">+{formatNumber(player.count)}</div><div className="tiny muted">adds</div></div><Button small variant={saved ? "danger" : "secondary"} onClick={() => toggleWatch(player)}>{saved ? "Saved" : "Watch"}</Button></Card>; })}
        </div>
        <section style={{marginTop:24}}><div className="section-head"><div><h2 className="section-title">Personalized claim plan</h2><div className="section-note">Uses your roster and current market</div></div>{!isPro ? <span className="lock-badge"><Icon.lock />PRO</span> : null}</div>
          {!isPro ? <PremiumGate title="Roster-specific waiver report" description="Turn raw add counts into a prioritized claim strategy for your exact team." bullets={["Top five claims", "FAAB bid guidance", "Recommended drop", "Positional need analysis"]} go={go} /> : <Card className="card-pad"><div className="row between gap-12"><div><div className="strong small">Build this week's report</div><div className="body-sm muted" style={{marginTop:4}}>{roster.length ? `${roster.length} saved players will shape the recommendations.` : "Add your roster for more precise recommendations."}</div></div><Button variant="primary" onClick={run} disabled={loading}>{loading ? <><Spinner />Building</> : <><Icon.spark />Generate</>}</Button></div></Card>}
        </section>
        {loading ? <div className="grid grid-2" style={{marginTop:13}}>{[1,2,3,4].map(i => <Card className="skeleton" style={{height:170}} key={i}/>)}</div> : null}
        {report ? <div style={{marginTop:13}}><Card className="result-hero"><StatusPill ai>{report.source || "ANALYSIS"}</StatusPill><p className="body-sm" style={{margin:"10px 0 0"}}>{report.summary}</p></Card><div className="grid grid-2" style={{marginTop:13}}>{(report.pickups || []).map((player,index) => <Card className="card-pad" key={`${player.player || player.name}-${index}`}><div className="row gap-10"><span className="result-rank">{index+1}</span><div className="grow min-0"><div className="row gap-7"><PositionChip pos={player.pos}/><div className="strong truncate">{player.player || player.name}</div></div></div><div style={{textAlign:"right"}}><div className="strong small" style={{color:"var(--orange)"}}>{player.faab}</div><div className="tiny muted">FAAB</div></div></div><div className="priority-bars" style={{marginTop:13}}>{[1,2,3,4,5].map(n => <span className={n <= player.priority ? "on" : ""} key={n}/>)}</div><p className="body-sm muted" style={{margin:"12px 0 0"}}>{player.reason}</p><div className="tiny" style={{marginTop:10,color:"var(--red)"}}><strong>DROP:</strong> {player.drop}</div></Card>)}</div></div> : null}
      </div>;
    }

    function Team({ roster, setRoster, watchlist, settings, setSettings, notify }) {
      const [showSampleConfirm, setShowSampleConfirm] = useState(false);
      const counts = useMemo(() => Object.fromEntries(POSITIONS.map(pos => [pos, roster.filter(p => p.pos === pos).length])), [roster]);
      const health = roster.length ? clamp(Math.round(51 + Math.min(roster.length,16)*1.8 + Object.values(counts).filter(Boolean).length*3),55,95) : 0;
      const needs = rosterNeeds(roster).slice(0,3);
      function loadSample() { setRoster(SAMPLE_ROSTER); setShowSampleConfirm(false); notify("Sample roster loaded. Replace it with your own players anytime."); }
      function clearRoster() { setRoster([]); notify("Roster cleared from this device."); }
      return <div className="page">
        <div className="eyebrow">PERSONALIZED TEAM PROFILE</div><h1 className="page-title">My Team</h1><p className="page-subtitle">Save your roster once. Every analysis tool uses it to understand positional strength, depth and acquisition priorities.</p>
        <div className="grid grid-2" style={{marginTop:18}}>
          <Card className="card-pad"><div className="row between gap-12"><div><div className="strong">Roster command</div><div className="tiny muted" style={{marginTop:4}}>Stored privately on this device</div></div><StatusPill ai>{roster.length} PLAYERS</StatusPill></div><div style={{marginTop:15}}><PlayerEditor players={roster} setPlayers={setRoster} placeholder="Add rostered player" addLabel="Add to roster" /></div>{!roster.length ? <Button block onClick={() => setShowSampleConfirm(true)} style={{marginTop:9}}>Load sample roster</Button> : <Button block variant="danger" onClick={clearRoster} style={{marginTop:12}}><Icon.trash />Clear roster</Button>}</Card>
          <div className="stack">
            <Card className="card-pad"><div className="row between gap-14"><div><div className="strong">Team health</div><p className="body-sm muted" style={{margin:"7px 0 0",maxWidth:250}}>{health >= 80 ? "Balanced roster structure with usable weekly depth." : health ? "Core pieces are present, but depth can improve." : "Add your roster to generate a health profile."}</p></div><div className="health-ring" style={{"--score":health || 1}}><div className="health-ring-content"><div className="health-ring-value">{health || "—"}</div><div className="health-ring-label">Health</div></div></div></div></Card>
            <Card className="card-pad"><div className="strong small">League profile</div><div className="form-grid" style={{marginTop:12}}><div className="field"><label>Scoring</label><select className="select" value={settings.format} onChange={e=>setSettings({...settings,format:e.target.value})}>{["PPR","Half PPR","Standard"].map(v=><option key={v}>{v}</option>)}</select></div><div className="field"><label>League size</label><select className="select" value={settings.leagueSize} onChange={e=>setSettings({...settings,leagueSize:Number(e.target.value)})}>{[8,10,12,14,16].map(v=><option key={v} value={v}>{v} teams</option>)}</select></div></div></Card>
          </div>
        </div>
        {roster.length ? <>
          <section style={{marginTop:22}}><div className="section-head"><div><h2 className="section-title">Roster architecture</h2><div className="section-note">Position distribution</div></div></div><div className="roster-summary">{POSITIONS.map(pos => <div className="roster-stat" key={pos}><strong>{counts[pos] || 0}</strong><span>{pos}</span></div>)}</div></section>
          <section style={{marginTop:22}}><div className="section-head"><div><h2 className="section-title">Current needs</h2><div className="section-note">Based on a balanced {settings.leagueSize}-team roster</div></div></div><div className="grid grid-3">{needs.map((need,index) => <Card className="card-pad" key={need.pos}><div className="row between"><PositionChip pos={need.pos}/><span className="tiny muted">Priority {index+1}</span></div><div className="display strong" style={{fontSize:21,marginTop:15}}>{need.count}/{need.target}</div><div className="tiny muted" style={{marginTop:5}}>current / target depth</div></Card>)}</div></section>
        </> : null}
        <section style={{marginTop:22}}><div className="section-head"><div><h2 className="section-title">Watchlist</h2><div className="section-note">Players saved from Waiver Radar</div></div></div>{watchlist.length ? <div className="grid grid-2">{watchlist.map((player,index) => <Card className="waiver-row" key={`${player.name}-${index}`}><Avatar player={player}/><div className="grow min-0"><div className="strong small truncate">{player.name}</div><div className="tiny muted" style={{marginTop:3}}>{player.pos} · {player.team}</div></div><div className="adds">+{formatNumber(player.count)}</div></Card>)}</div> : <Card className="empty-state"><div className="empty-icon"><Icon.target /></div><div className="strong small" style={{marginTop:12}}>No watched players yet</div><p className="tiny muted" style={{margin:"6px 0 0"}}>Save targets from Waiver Radar to track them here.</p></Card>}</section>
        {showSampleConfirm ? <div className="modal-backdrop" onMouseDown={e => e.target===e.currentTarget && setShowSampleConfirm(false)}><div className="modal"><div className="modal-head"><div className="display strong">Load sample roster?</div><button className="icon-button" onClick={() => setShowSampleConfirm(false)}><Icon.x/></button></div><div className="modal-body"><p className="body-sm muted" style={{marginTop:0}}>This adds six example players so you can preview the personalized experience. You can remove them individually or clear the roster afterward.</p><Button variant="primary" block onClick={loadSample}>Load sample roster</Button></div></div></div> : null}
      </div>;
    }

    function Upgrade({ isPro, setIsPro, go, notify }) {
      const [plan, setPlan] = useState("annual");
      const plans = CONFIG.pricing;
      function subscribe() {
        const url = plan === "annual" ? CONFIG.stripeAnnual : CONFIG.stripeMonthly;
        if (url) window.open(url,"_blank","noopener,noreferrer");
        else notify("Add your Stripe Payment Link in the CONFIG block before launch. Demo unlock is available below.");
      }
      if (isPro) return <div className="page"><Card className="upgrade-hero"><div className="upgrade-mark" style={{background:"var(--green-soft)",color:"var(--green)",border:"1px solid rgba(52,211,153,.2)"}}><Icon.check/></div><h1 className="page-title" style={{fontSize:34,marginTop:17}}>Pro is active</h1><p className="page-subtitle" style={{margin:"10px auto 0"}}>Your full fantasy command center is unlocked on this device.</p><div className="hero-actions" style={{justifyContent:"center"}}><Button variant="primary" onClick={() => go("startsit")}>Run Start/Sit <Icon.arrow/></Button><Button onClick={() => go("home")}>Return home</Button></div><button className="button button-ghost" style={{marginTop:14}} onClick={() => setIsPro(false)}>Reset demo access</button></Card></div>;
      const features = ["Unlimited Start/Sit decisions", "Full trade grades and counter strategy", "Personalized waiver reports", "FAAB and drop recommendations", "Roster health and need modeling", "Secure AI-proxy ready architecture"];
      return <div className="page">
        <Card className="upgrade-hero"><div className="upgrade-mark"><Icon.bolt/></div><div className="eyebrow" style={{marginTop:18}}>SNAPCOUNT PRO</div><h1 className="page-title" style={{fontSize:38,marginTop:8}}>Build an unfair decision edge.</h1><p className="page-subtitle" style={{margin:"12px auto 0"}}>One smarter lineup, trade or waiver decision can change an entire season.</p></Card>
        <div className="grid grid-2" style={{marginTop:14}}>{["annual","monthly"].map(key => { const item = plans[key]; return <Card as="button" className={`plan-card ${plan===key?"active":""}`} onClick={() => setPlan(key)} key={key}><div className="row between"><div className="strong small">{item.label}</div><StatusPill live={key==="annual"}>{item.note}</StatusPill></div><div style={{marginTop:12}}><span className="display strong" style={{fontSize:29}}>{item.price}</span><span className="small muted"> {item.suffix}</span></div></Card>; })}</div>
        <Button variant="primary" block onClick={subscribe} style={{marginTop:14}}>Start {plans[plan].label} <Icon.arrow/></Button>
        <Card className="card-pad" style={{marginTop:14}}><div className="display strong">Everything in Pro</div><div className="grid grid-2" style={{marginTop:15}}>{features.map((feature,index) => <div className="feature-row" key={index}><span className="feature-check"><Icon.check/></span><span className="small">{feature}</span></div>)}</div></Card>
        <Button block onClick={() => {setIsPro(true);go("home");notify("Demo Pro access unlocked on this device.");}} style={{marginTop:14}}>Demo unlock for testing</Button>
        <p className="disclaimer" style={{textAlign:"center"}}>Before accepting real payments, connect Stripe and verify subscription status server-side. The local demo flag is intentionally for testing only.</p>
      </div>;
    }

    function SettingsModal({ settings, setSettings, onClose, installApp, notify }) {
      function reset() { setSettings(DEFAULT_SETTINGS); notify("League settings reset."); }
      return <div className="modal-backdrop" onMouseDown={e => e.target===e.currentTarget && onClose()}><div className="modal" role="dialog" aria-modal="true" aria-label="Settings"><div className="modal-head"><div><div className="display strong">Settings</div><div className="tiny muted" style={{marginTop:3}}>League and app preferences</div></div><button className="icon-button" onClick={onClose}><Icon.x/></button></div><div className="modal-body"><div className="stack"><div className="field"><label>Default scoring</label><select className="select" value={settings.format} onChange={e=>setSettings({...settings,format:e.target.value})}>{["PPR","Half PPR","Standard"].map(v=><option key={v}>{v}</option>)}</select></div><div className="field"><label>Current week</label><select className="select" value={settings.week} onChange={e=>setSettings({...settings,week:Number(e.target.value)})}>{Array.from({length:18},(_,i)=>i+1).map(w=><option key={w} value={w}>Week {w}</option>)}</select></div><div className="field"><label>League size</label><select className="select" value={settings.leagueSize} onChange={e=>setSettings({...settings,leagueSize:Number(e.target.value)})}>{[8,10,12,14,16].map(v=><option key={v} value={v}>{v} teams</option>)}</select></div><Button variant="primary" block onClick={installApp}>Add SNAPCOUNT to home screen</Button><Button block onClick={reset}>Reset league settings</Button></div><Card className="card-pad" style={{marginTop:15,background:"rgba(96,165,250,.05)",borderColor:"rgba(96,165,250,.14)"}}><div className="row gap-8"><Icon.shield style={{width:18,color:"var(--blue)"}}/><div className="strong small">Privacy by design</div></div><p className="tiny muted" style={{lineHeight:1.6,margin:"8px 0 0"}}>Your roster, watchlist and demo subscription state remain in this browser's local storage. No private API key is stored in the app.</p></Card></div></div></div>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<AppErrorBoundary><App /></AppErrorBoundary>);
  </script>
</body>
</html>
